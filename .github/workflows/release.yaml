name: Publish Webhook Module Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    name: Build, Attest and Publish to PyPI
    runs-on: ubuntu-latest
    
    # Добавляем окружение, как просит документация PyPI
    environment:
      name: pypi
      url: https://pypi.org/project/readx

    permissions:
      id-token: write      # КРИТИЧЕСКИ ВАЖНО: для Trusted Publishing и Provenance подписи
      contents: write      # Разрешение на загрузку файлов в релиз GitHub
      attestations: write  # Разрешение на генерацию аттестации SLSA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Шаг сборки пакетов
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distributions
        run: python -m build

      # Шаг криптографической подписи (Provenance)
      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*'

      # Шаг сохранения файлов на самом Гитхабе
      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Легитный шаг публикации на PyPI (с правильным именем gh-action-pypi-publish)
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
